
services:
  crm_server:
    image: twentycrm/twenty:${CRM_TAG:-latest}
    container_name: crm_server
    networks:
      - ingress
      - frontend
      - database
      - backend
    volumes:
      - crm-server-local-data:/app/packages/twenty-server/.local-storage
      - ../backups/crm/server:/backup
      - ../logs/crm/server:/var/log/
    ports:
      - ${CRM_SERVER_PORT}:3000
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://crm:${CRM_DATABASE_PASSWORD}@crm_db:5432/crm
      SERVER_URL: https://crm.${DOMAIN}
      REDIS_URL: redis://crm_redis:6379
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: "local"
      APP_SECRET: ${CRM_APP_SECRET}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-contact@yourdomain.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"John from YourDomain"}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-system@yourdomain.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      crm_db:
        condition: service_healthy
      crm_redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    image: twentycrm/twenty:${CRM_TAG:-latest}
    container_name: crm_worker
    networks:
      - database
      - backend
    volumes:
      - crm-server-local-data-worker:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://crm:${CRM_DATABASE_PASSWORD}@crm_db:5432/crm
      SERVER_URL: https://crm.${DOMAIN}
      REDIS_URL: redis://crm_redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: "local"
      APP_SECRET: ${CRM_APP_SECRET}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-contact@yourdomain.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"John from YourDomain"}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-system@yourdomain.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      crm_db:
        condition: service_healthy
      crm_server:
        condition: service_healthy
    restart: unless-stopped

  crm_db:
    image: postgres:17-trixie
    container_name: crm_db
    restart: unless-stopped
    networks:
      - database
    volumes:
      - crm_db:/var/lib/postgresql/data
      - ../migrations:/app/migrations
      - ../logs/crm/db:/var/log/
      - ../backups/crm/db:/backups
    environment:
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${CRM_DATABASE_PASSWORD}
      POSTGRES_USER: crm
    healthcheck:
      test: pg_isready -U crm -h localhost -d crm
      interval: 5s
      timeout: 5s
      retries: 10

  crm_redis:
    image: redis
    container_name: crm_redis
    restart: unless-stopped
    networks:
      - database
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm-server-local-data:
  crm-server-local-data-worker:
  crm_db:
