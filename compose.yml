name: support-pi

###
### Networks
###

networks:
  ingress:
    driver: bridge
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge


###
### Include
###

include:
  - path: ./docker/data.yml
  - path: ./docker/n8n.yml

###
### Services
###

services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-support-pi-tunnel
    hostname: cloudflare-support-pi-tunnel
    restart: unless-stopped
    command: tunnel run
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/cloudflare/hosts:/etc/hosts
      - ./backups/cloudflare:/backups
    environment:
      - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}'
    networks:
      - ingress
    healthcheck:
      test: ['CMD', 'cloudflared', '--version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    networks:
      - ingress
      - frontend
    ports:
      - ${DOCKHAND_PORT}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
      - ./backups/dockhand:/app/backups

  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - ingress
      - frontend
    environment:
      - DOCKHAND_URL=http://dockhand:3000
      - DOCKHAND_API_TOKEN=${DOCKHAND_API_TOKEN}
      - DOCKHAND_ENV_ID=${DOCKHAND_ENV_ID_1}
    volumes:
      - ./config/glance/config:/app/config
      - ./config/glance/assets:/app/assets
      - ./backups/glance:/app/backups
    ports:
      - ${GLANCE_PORT}:8080

volumes:
  dockhand_data:
  dashy_data:
