name: support-pi

###
### Networks
###

networks:
  ingress:
    driver: bridge
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge


###
### Include
###

include:
  - path: ./docker/data.yml
  - path: ./docker/crm.yml
  - path: ./docker/n8n.yml

###
### Services
###

services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-support-pi-tunnel
    hostname: cloudflare-support-pi-tunnel
    restart: unless-stopped
    command: tunnel run
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/cloudflare/hosts:/etc/hosts
      - ./logs/cloudflare:/var/log/cloudflared
      - ./backups/cloudflare:/backups
    environment:
      - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}'
    networks:
      - ingress
    healthcheck:
      test: ['CMD', 'cloudflared', '--version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    networks:
      - ingress
      - frontend
    ports:
      - ${DOCKHAND_PORT}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
      - ./logs/dockhand:/var/log/
      - ./backups/dockhand:/app/backups

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    user: "1000:1000"
    ports:
      - ${DASHY_PORT}:8080
    networks:
      - ingress
      - frontend
    volumes:
      - ./config/dashy/:/app/user-data
      - ./logs/dashy:/var/log/
      - ./backups/dashy:/app/backups
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '/app/services/healthcheck.js']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dockhand_data:
  dashy_data:
